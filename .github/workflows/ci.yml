name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env: { CLICKHOUSE_USER: platform, CLICKHOUSE_PASSWORD: platform, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1 }
        ports: ["18123:8123"]
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: platform, MYSQL_DATABASE: demo }
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pplatform" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=70
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:pg@localhost:55432/platform_test
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m scripts.export_openapi /tmp/openapi.json
          diff -u ../frontend/src/shared/api/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && npx prettier --write src/shared/api/schema.d.ts && git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # The official image instead of trivy-action: the action's binary installer failed to download Trivy.
      - name: Dependency & IaC scan (Trivy)
        run: >
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.66.0 fs
          --scanners vuln,misconfig --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /repo

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        # compose refuses to start without SECRET_KEY; a placeholder is enough to build images
        env: { SECRET_KEY: ci-build-only }
        run: docker compose build api web
