# Local development dependencies with published ports:
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: analytics-platform-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
    ports: ["5432:5432"]
  postgres-test:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: pg }
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment: { CLICKHOUSE_USER: platform, CLICKHOUSE_PASSWORD: platform, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1 }
    ports: ["8123:8123", "18123:8123"]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: platform, MYSQL_DATABASE: demo }
    ports: ["13306:3306"]
