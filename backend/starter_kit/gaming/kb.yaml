examples:
  - type: experiment
    project: iron_shells
    title: "Iron Shells · Стартовый набор $4.99 → $5.99"
    summary: "Повышение цены стартового набора на $1 снизило конверсию в платёж, рост выручки с набора не компенсировал потерю плательщиков: ARPU D7 не вырос. Решение — оставить $4.99."
    decision: rejected
    tags: [pricing, starter-pack, monetisation, ab]
    author: P. Orlov
    body: |
      ## Гипотеза
      Если поднять цену стартового набора с $4.99 до $5.99, ARPU вырастет, потому что спрос на набор неэластичен в мидкоре.

      ## Результат
      Конверсия в платёж D7 в группе B заметно ниже, P(B>A) по ARPU D7 далеко от порога 0,95.
      Подробные цифры — в карточке эксперимента `starter_pack_price` (раздел A/B).

      ## Вывод и решение
      Отклонено: оставить $4.99. Повторить тест на сегменте T1-стран, где эластичность может быть ниже.
  - type: experiment
    project: iron_shells
    title: "Iron Shells · Новый туториал (tutorial_v2)"
    summary: "Сокращённый туториал поднял Retention D7 на ~2 п.п. Решение — раскатить на 100%."
    decision: accepted
    tags: [onboarding, tutorial, retention, ab]
    author: A. Volkova
    body: |
      ## Гипотеза
      Если сократить туториал с 9 до 5 шагов и дать первый бой раньше, Retention D7 вырастет, потому что новички быстрее доходят до основного геймплея.

      ## Дизайн
      - Первичная метрика: Retention D7
      - Защитные метрики: Retention D1, активные дни D7
      - Группы: A — старый туториал, B — новый, 50/50
      - Сегменты: платформа, источник трафика

      ## Результат
      Retention D7: 17,5% в контроле и 19,6% в новом варианте (+12% относительно, около +2 п.п.); вероятность, что вариант B лучше, — 96,5%. Защитные метрики не ухудшились: Retention D1 +4,7%, активные дни D7 +4,6%. Дисбаланса групп нет. Подробные цифры — в карточке эксперимента `tutorial_v2` (раздел A/B).

      ## Вывод и решение
      Принято: раскатить новый туториал на 100% игроков. Следующий шаг — проверить шаги 3 и 7, где по исследованию воронки теряется больше всего новичков.
  - type: experiment
    project: bloom_merge
    title: "Bloom & Merge · Дополнительный ежедневный квест"
    summary: "Четвёртый квест не изменил удержание (+0,2 п.п., незначимо) и снизил выполнение квестов на 5 п.п."
    decision: rejected
    tags: [liveops, quests, retention, ab]
    author: M. Sokolov
    body: |
      ## Гипотеза
      Если добавить четвёртый ежедневный квест, игроки будут чаще возвращаться в первую неделю, потому что у них появится ещё одна цель на день.

      ## Результат
      Удержание почти не изменилось: +0,2 п.п., разница статистически незначима. Доля выполненных квестов снизилась на 5 п.п. — дополнительное задание воспринимается как нагрузка.

      ## Вывод и решение
      Отклонено: оставить три квеста. Проверить другую гипотезу — более ценную награду за серию из трёх квестов.
  - type: research
    project: iron_shells
    title: "Почему новые игроки уходят в первые 24 часа"
    summary: "Воронка показала два провала: шаги 3 и 7 туториала (−12% и −9%)."
    tags: [onboarding, funnel, retention]
    author: A. Volkova
    body: |
      ## Вопрос
      На каких шагах первой сессии теряется больше всего новичков Iron Shells?

      ## Данные и метод
      Воронка событий `tutorial_step` по когортам установок, разрез по платформам и источникам трафика.

      ## Находки
      Два провала: шаг 3 туториала (−12%) и шаг 7 (−9%). На остальных шагах потери небольшие.

      ## Рекомендации
      Сократить туториал и раньше дать первый бой — эту гипотезу проверили в эксперименте `tutorial_v2`.
  - type: incident_report
    project: iron_shells
    title: "iOS 1.8.0: iap_purchase перестал отправляться у 85% платежей"
    summary: "После релиза 1.8.0 на iOS событие покупки терялось; реестр событий поднял алерт через 2 часа, выручка в сторе не пострадала."
    tags: [incident, ios, ems, iap]
    author: M. Sokolov
    body: |
      ## Что случилось
      После релиза 1.8.0 на iOS событие `iap_purchase` отправлялось только для 15% платежей.

      ## Влияние
      Дашборды монетизации занижали выручку iOS; отчёт стора не пострадал.

      ## Причина
      SDK-обёртка вызывала трекинг до подтверждения транзакции StoreKit 2.

      ## Что исправили
      Хотфикс 1.8.1, контроль частоты события в реестре событий (порог 50% от базовой).
  - type: playbook
    title: "Как запустить LiveOps-ивент от начала до конца"
    summary: "Шесть шагов: дизайн события в реестре, дашборд, A/B, пострелизная проверка, разбор итогов."
    tags: [liveops, playbook, process]
    author: A. Volkova
    body: |
      ## Когда применять
      Перед любым ограниченным по времени событием в игре: праздничный ивент, новый режим, распродажа.

      ## Шаги
      1. Описать новые события ивента в реестре и отправить на утверждение.
      2. Собрать дашборд ивента из шаблона.
      3. Спланировать A/B-тест, если меняется экономика или награды.
      4. После релиза проверить разметку в мониторинге реестра.
      5. Следить за метриками ивента и защитными метриками.
      6. Разобрать итоги и сохранить вывод в базу знаний.

      ## Ответственные
      Продакт — цель и дизайн ивента, аналитик — разметка, дашборд и итоги, руководитель аналитики — утверждение событий.
  - type: decision_log
    title: "Байесовский подход вместо частотного для A/B"
    summary: "60% наших тестов имеют меньше 10 тыс. пользователей на группу; P(B>A) понятнее продуктам на любом шаге."
    tags: [statistics, ab, methodology]
    author: Y. Sanochkin
    body: |
      ## Решение
      Основной результат A/B-теста показываем как вероятность, что вариант лучше контроля, и ожидаемые потери; частотный p-value остаётся для сверки.

      ## Контекст и альтернативы
      60% наших тестов имеют меньше 10 тыс. пользователей на группу. Альтернатива — только частотные тесты с фиксированным размером выборки.

      ## Почему так
      Вероятность понятнее продуктам и корректно читается на любом шаге теста, без ожидания заранее рассчитанной выборки.
  - type: metric_definition
    title: "Retention D7: определение"
    summary: "Доля игроков когорты установки, активных ровно на 7-й день после установки (day_n = 7)."
    tags: [retention, definition, metric]
    author: data-team
    links: [{kind: metric, ref: retention_d7, title: Retention D7}]
    body: |
      ## Формула
      ```sql
      count(distinct if(day_n = 7, user_id, null)) / count(distinct user_id)  -- по когорте установки
      ```
      ## Подводные камни
      Когорты младше 7 дней исключаются (зрелость когорты).
  - type: case
    project: bloom_merge
    title: "Кросс-промо Bloom & Merge → Iron Shells"
    summary: "Баннер кросс-промо конвертирует 3,1% и даёт IPM в 1,6 раза выше Facebook."
    tags: [ua, cross-promo]
    author: I. Petrov
    body: |
      ## Контекст
      Искали дешёвый источник установок Iron Shells среди собственной аудитории студии.

      ## Что сделали
      Показали баннер кросс-промо игрокам Bloom & Merge.

      ## Результат в цифрах
      Конверсия баннера — 3,1%; IPM в 1,6 раза выше, чем у Facebook.

      ## Чему научились
      Собственная аудитория — сильный канал для новых игр студии; качество этих игроков стоит отслеживать по удержанию.
  - type: research
    project: drift_kings
    title: "Drift Kings · Качество источников трафика"
    summary: "Mintegral приносит дешёвые установки, но D7 на 35% ниже органики; ROAS D7 не окупается."
    tags: [ua, retention, sources]
    author: I. Petrov
    body: |
      ## Вопрос
      Какие источники трафика приносят окупающихся игроков Drift Kings?

      ## Данные и метод
      Когорты установок по источникам: удержание D7 и ROAS D7.

      ## Находки
      Mintegral приносит дешёвые установки, но Retention D7 на 35% ниже органики, и ROAS D7 не окупается.

      ## Рекомендации
      Снизить бюджет на Mintegral и сравнивать источники по удержанию и ROAS, а не по цене установки.
